name: Refresh game pages
on:
  push:
    branches: [main]
    paths:
      - games.json
      - index.html
      - scripts/generate-routes.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate pages
        run: node scripts/generate-routes.mjs
      - name: Publish generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh game and section pages"
            git pull --rebase
            git push
          fi
