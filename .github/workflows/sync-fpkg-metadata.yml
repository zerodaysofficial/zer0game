name: Sync FPKG catalog

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fpkg-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync FPKG catalog
        run: python .github/scripts/sync_fpkg_metadata.py

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- games.json fpkg-pending-direct.json; then
            echo "No catalog changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json fpkg-pending-direct.json
          git commit -m "Auto-sync FPKG catalog"
          git push
