name: Build ZER0GAME APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Install Gradle 8.7
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle

      - name: Build installable APK
        shell: bash
        run: /tmp/gradle/gradle-8.7/bin/gradle -p android-app :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk ZER0GAME.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZER0GAME-APK
          path: ZER0GAME.apk
          retention-days: 30
