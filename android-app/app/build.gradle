plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.zerodaysofficial.zer0game'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.zerodaysofficial.zer0game"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}
