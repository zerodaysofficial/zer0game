.pw{
 position:absolute;
 left:34.35%;top:62.35%;

<body>
<div class="stage" aria-label="ZER0DAY access page">
 <a class="hit donate" href="https://ko-fi.com/zzer0dayyy" target="_blank" rel="noopener noreferrer" aria-label="Donate"></a>
 <a class="hit follow" href="https://x.com/_zer0day__" target="_blank" rel="noopener noreferrer" aria-label="Follow on X"></a>
 <input id="pw" class="pw" type="password" autocomplete="off" placeholder="Type password..." aria-label="Password">
 <button id="eye" class="eye" type="button" aria-label="Show or hide password"></button>
 <button id="unlock" class="hit unlock" type="button" aria-label="Unlock"></button>
 <div id="msg" class="msg"></div>
</div>
<script>
const HASH="6fac255cd8b8a48872bc15838607a084823cf332edf7d5bda6323335eb608774";
const pw=document.getElementById("pw"), eye=document.getElementById("eye"), unlock=document.getElementById("unlock"), msg=document.getElementById("msg");
async function sha256(s){const b=new TextEncoder().encode(s);const d=await crypto.subtle.digest("SHA-256",b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function target(){
 const q=new URLSearchParams(location.search).get("to");
 if(q){try{const u=new URL(q,location.href);if(/^https?:$/.test(u.protocol))return u.href}catch{}}
 const h=location.hash.slice(1);if(!h)return "";
 try{const bin=atob(h),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)),s=new TextDecoder().decode(bytes),u=new URL(s);if(/^https?:$/.test(u.protocol))return u.href}catch{}
 try{const s=atob(h),u=new URL(s);if(/^https?:$/.test(u.protocol))return u.href}catch{}
 return "";
}
function say(t,ok=false){msg.textContent=t;msg.className="msg"+(ok?" ok":"")}
async function go(){
 pw.classList.remove("bad");say("");
 if(await sha256(pw.value.trim())!==HASH){pw.classList.add("bad");say("Wrong password.");pw.select();return}
 const u=target();say("Access unlocked.",true);
 if(u)setTimeout(()=>location.assign(u),250);
}
eye.onclick=()=>{pw.type=pw.type==="password"?"text":"password";pw.focus()}
unlock.onclick=go;
pw.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
</script>
