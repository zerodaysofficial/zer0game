<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020812">
  <title>ZER0DAY Access</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Knewave&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --cyan:#21dfff;
      --cyan2:#168dff;
      --mint:#18efbd;
      --amber:#ffb312;
      --panel:rgba(3,13,23,.72);
      --ink:#ecf7ff;
      --muted:#8ca7ca;
    }
    *{box-sizing:border-box}
    html,body,#root{min-width:100%;min-height:100%;margin:0}
    body{
      margin:0;
      min-height:100vh;
      overflow:auto;
      color:var(--ink);
      background:#020812;
      font-family:"Orbitron",system-ui,sans-serif;
    }

    .app{
      position:relative;
      min-height:100vh;
      display:grid;
      place-items:center;
      overflow:hidden;
      padding:26px;
      background:
        radial-gradient(circle at 50% -13%,rgba(22,129,255,.26),transparent 35%),
        radial-gradient(circle at 28% 18%,rgba(9,238,199,.11),transparent 24%),
        linear-gradient(180deg,#020711 0%,#04101b 51%,#05111e 100%);
    }

    .stars{
      position:absolute; inset:0; opacity:.42; pointer-events:none;
      background-image:
        radial-gradient(circle at 10% 20%,#a9eaff 0 1px,transparent 1.6px),
        radial-gradient(circle at 17% 46%,#6dc9ff 0 1px,transparent 1.6px),
        radial-gradient(circle at 82% 25%,#8ff7e4 0 1px,transparent 1.6px),
        radial-gradient(circle at 92% 52%,#7cbaff 0 1px,transparent 1.6px),
        radial-gradient(circle at 67% 10%,#c6f6ff 0 1px,transparent 1.6px);
      background-size:340px 300px,420px 360px,370px 320px,460px 380px,520px 430px;
    }

    .planet-main{
      position:absolute;
      width:min(76vw,1120px);
      aspect-ratio:1;
      left:50%; top:-55%;
      transform:translateX(-50%);
      border-radius:50%;
      background:
        radial-gradient(circle at 30% 62%,rgba(31,255,206,.78),transparent 18%),
        radial-gradient(circle at 70% 58%,rgba(33,150,255,.82),transparent 21%),
        radial-gradient(circle at 50% 50%,#0f2f47 0 35%,#071727 52%,#020912 73%);
      box-shadow:
        0 0 0 2px rgba(73,225,255,.48),
        0 0 58px rgba(15,184,255,.34),
        0 0 160px rgba(0,91,255,.20),
        inset -80px -90px 180px rgba(0,0,0,.62);
      opacity:.96;
    }
    .planet-main:after{
      content:"";position:absolute;inset:-4px;border-radius:inherit;
      border:2px solid rgba(51,239,210,.28);
      filter:blur(2px);
    }
    .planet-small{
      position:absolute;
      right:-7vw;top:29%;
      width:min(28vw,430px);aspect-ratio:1;border-radius:50%;
      background:
        radial-gradient(circle at 48% 48%,rgba(49,119,255,.70),transparent 45%),
        radial-gradient(circle,#0c1e33 0 38%,#05101c 66%,transparent 68%);
      box-shadow:0 0 0 2px rgba(81,157,255,.27),0 0 42px rgba(37,134,255,.26);
      opacity:.78;
    }
    .lightning{
      position:absolute;
      right:10%;top:24%;width:190px;height:210px;
      opacity:.50;filter:drop-shadow(0 0 9px #2c8cff);
    }
    .lightning:before,.lightning:after{
      content:"";position:absolute;width:3px;background:#78c9ff;
      transform-origin:top center;border-radius:3px;
    }
    .lightning:before{height:120px;left:90px;top:0;transform:rotate(28deg);box-shadow:22px 66px 0 -1px #78c9ff}
    .lightning:after{height:82px;left:115px;top:92px;transform:rotate(-34deg)}

    .ridge{
      position:absolute;bottom:0;width:46vw;height:46vh;
      background:linear-gradient(180deg,#081a29,#020912 78%);
      filter:drop-shadow(0 0 24px rgba(15,180,255,.12));
      opacity:.96;
    }
    .ridge.left{left:-8%;clip-path:polygon(0 100%,0 61%,8% 57%,15% 37%,24% 53%,31% 23%,40% 43%,48% 27%,58% 59%,69% 43%,78% 67%,88% 61%,100% 100%)}
    .ridge.right{right:-9%;transform:scaleX(-1);clip-path:polygon(0 100%,0 61%,8% 57%,15% 37%,24% 53%,31% 23%,40% 43%,48% 27%,58% 59%,69% 43%,78% 67%,88% 61%,100% 100%)}

    .mist{
      position:absolute;left:-8%;right:-8%;bottom:7%;height:27%;
      background:
        radial-gradient(ellipse at 18% 50%,rgba(20,235,207,.17),transparent 45%),
        radial-gradient(ellipse at 82% 55%,rgba(34,137,255,.17),transparent 44%),
        linear-gradient(180deg,transparent,rgba(135,222,255,.08),transparent);
      filter:blur(24px);
    }
    .water{
      position:absolute;left:0;right:0;bottom:0;height:22%;
      background:
        repeating-linear-gradient(0deg,rgba(78,181,255,.055) 0 1px,transparent 1px 10px),
        linear-gradient(180deg,rgba(0,0,0,0),rgba(0,8,17,.82));
    }

    .panel{
      position:relative;
      width:min(956px,92vw,calc(91vh * 1.0599));
      aspect-ratio:956/902;
      border:1.5px solid rgba(29,184,255,.78);
      border-radius:26px;
      background:
        linear-gradient(180deg,rgba(2,11,20,.83),rgba(2,15,26,.76)),
        radial-gradient(circle at 50% 12%,rgba(27,146,255,.08),transparent 31%);
      box-shadow:
        0 32px 95px rgba(0,0,0,.52),
        0 0 32px rgba(27,172,255,.15),
        inset 0 1px rgba(255,255,255,.045);
      backdrop-filter:blur(12px) saturate(120%);
      -webkit-backdrop-filter:blur(12px) saturate(120%);
      overflow:hidden;
      z-index:2;
    }
    .panel:before{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(118deg,transparent 8%,rgba(20,239,209,.045) 35%,transparent 56%);
    }

    .brand{
      position:absolute;left:10%;right:10%;top:4.6%;height:24%;
      text-align:center;
    }
    .logo{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:0;
      font-family:"Knewave",cursive;
      font-size:clamp(48px,6.5vw,88px);
      line-height:.9;
      letter-spacing:-.075em;
      transform:skewX(-8deg) rotate(-1deg);
      filter:drop-shadow(0 5px 0 rgba(0,0,0,.28)) drop-shadow(0 0 14px rgba(0,211,255,.18));
      white-space:nowrap;
    }
    .logo .zer{color:#f5f9fb;text-shadow:-3px 2px 0 #0b2536}
    .logo .oday{
      background:linear-gradient(90deg,#19efbd 0%,#18ddd4 45%,#16b8ff 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      text-shadow:none;
    }
    .logo:before,.logo:after{
      content:"";position:absolute;height:8px;border-radius:20px;transform:rotate(-13deg);opacity:.75
    }
    .logo:before{width:48px;left:-22px;bottom:17px;background:linear-gradient(90deg,transparent,#eaf7ff)}
    .logo:after{width:52px;right:-26px;top:20px;background:linear-gradient(90deg,#18efbd,transparent)}

    .nav{
      margin-top:2.7%;
      display:flex;justify-content:center;gap:4.3%;
      font-size:clamp(9px,1.1vw,16px);
      letter-spacing:.42em;text-transform:uppercase;color:#94a9c8;
      font-weight:600;
    }
    .tag{
      margin-top:2.3%;
      display:flex;justify-content:center;gap:2.6%;
      font-size:clamp(7px,.82vw,12px);
      letter-spacing:.27em;text-transform:uppercase;color:#b6c5da;
      font-weight:600;
    }

    .cards{
      position:absolute;left:3.9%;right:3.9%;top:29.6%;height:16.7%;
      display:grid;grid-template-columns:1fr 1fr;gap:2.8%;
    }
    .social{
      position:relative;
      display:flex;align-items:center;
      padding:0 5.2%;
      border-radius:22px;text-decoration:none;color:white;
      overflow:hidden;isolation:isolate;
      transition:transform .16s ease,filter .16s ease;
    }
    .social:hover{transform:translateY(-2px);filter:brightness(1.06)}
    .social:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(120deg,rgba(255,255,255,.10),transparent 52%)}
    .social.donate{
      border:2px solid #ffb514;
      background:linear-gradient(115deg,rgba(91,51,0,.78),rgba(12,9,7,.88));
      box-shadow:0 0 25px rgba(255,174,0,.22),inset 0 0 26px rgba(255,172,0,.06);
    }
    .social.x{
      border:2px solid #2cbcff;
      background:linear-gradient(115deg,rgba(7,52,97,.80),rgba(3,14,27,.90));
      box-shadow:0 0 25px rgba(30,168,255,.20),inset 0 0 26px rgba(30,168,255,.06);
    }
    .social-icon{
      width:28%;height:76%;display:grid;place-items:center;flex:0 0 28%;
    }
    .social-icon svg{width:90%;height:90%;overflow:visible}
    .xmark{
      font-family:Arial Black,Arial,sans-serif;
      font-size:clamp(44px,5vw,74px);
      line-height:1;color:#fff;text-shadow:0 0 18px rgba(0,176,255,.55);
    }
    .social-copy{min-width:0}
    .social-title{
      font-family:"Bebas Neue",sans-serif;
      font-size:clamp(27px,3.25vw,46px);
      letter-spacing:.04em;line-height:.9;white-space:nowrap;
    }
    .social-sub{
      margin-top:7%;
      font-family:Arial,sans-serif;
      font-size:clamp(8px,.8vw,12px);
      letter-spacing:.04em;
      color:#ffe28a;
      white-space:nowrap;
    }
    .x .social-sub{color:#b7ddff}
    .circle-arrow{
      margin-left:auto;width:12%;aspect-ratio:1;border-radius:50%;
      border:1px solid rgba(255,255,255,.78);
      display:grid;place-items:center;
      font-size:clamp(15px,1.7vw,25px);
    }

    .lockwrap{
      position:absolute;left:22%;right:22%;top:49.2%;height:43%;
      text-align:center;
    }
    .lockicon{
      width:6.8%;aspect-ratio:.84/1;margin:0 auto 1.8%;
      position:relative;
    }
    .lockicon:before{
      content:"";position:absolute;left:16%;right:16%;top:0;height:49%;
      border:clamp(3px,.45vw,6px) solid #35f0c5;border-bottom:0;border-radius:50% 50% 0 0;
      filter:drop-shadow(0 0 8px rgba(43,239,213,.35));
    }
    .lockicon:after{
      content:"";position:absolute;left:0;right:0;bottom:0;height:62%;
      border-radius:8px;
      background:linear-gradient(180deg,#35efca,#27dfe5);
      box-shadow:0 0 20px rgba(39,232,223,.35);
    }
    .keyhole{
      position:absolute;z-index:2;left:50%;top:58%;transform:translate(-50%,-50%);
      width:15%;aspect-ratio:1;border-radius:50%;background:#062027;
    }
    .keyhole:after{content:"";position:absolute;left:37%;top:70%;width:26%;height:80%;background:#062027;border-radius:4px}

    .unlock-title{
      margin-top:2%;
      font-size:clamp(12px,1.55vw,22px);
      font-weight:800;
      letter-spacing:.24em;text-transform:uppercase;
      white-space:nowrap;
    }
    .unlock-sub{
      margin-top:1.7%;
      font-size:clamp(7px,.82vw,12px);
      letter-spacing:.28em;color:#7896c5;text-transform:uppercase;
    }

    .inputbox{
      position:absolute;left:2%;right:2%;top:35.3%;height:18.6%;
      display:flex;align-items:center;
      border:1px solid rgba(100,157,215,.68);
      border-radius:15px;background:rgba(5,16,29,.82);
      box-shadow:inset 0 0 25px rgba(0,0,0,.17);
    }
    .inputbox:focus-within{border-color:#32d4ff;box-shadow:0 0 0 3px rgba(50,212,255,.08)}
    .mini-lock{
      width:8%;height:100%;position:relative;flex:0 0 8%;
    }
    .mini-lock:before{
      content:"";position:absolute;width:23%;height:24%;left:39%;top:24%;
      border:2px solid #7ca3d4;border-bottom:0;border-radius:8px 8px 0 0;
    }
    .mini-lock:after{
      content:"";position:absolute;width:34%;height:32%;left:34%;top:43%;
      border:2px solid #7ca3d4;border-radius:3px;
    }
    .inputbox input{
      flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;
      color:#eff8ff;font-family:Arial,sans-serif;
      font-size:clamp(11px,1.15vw,17px);
      padding:0 1%;
    }
    .inputbox input::placeholder{color:#8ea8ca}
    .eye{
      width:9%;height:100%;border:0;background:transparent;cursor:pointer;
      display:grid;place-items:center;padding:0;
    }
    .eye svg{width:38%;min-width:17px;stroke:#84a5ce;fill:none;stroke-width:2}

    .unlock-btn{
      position:absolute;left:10.5%;right:10.5%;top:57.7%;height:17%;
      border:0;border-radius:15px;cursor:pointer;
      background:linear-gradient(90deg,#20efbb 0%,#1cd7e3 55%,#19b9ff 100%);
      color:#00191d;
      font-family:"Orbitron",sans-serif;
      font-size:clamp(10px,1.05vw,16px);
      font-weight:900;letter-spacing:.21em;text-transform:uppercase;
      box-shadow:0 0 24px rgba(28,219,233,.22);
      transition:transform .16s ease,filter .16s ease;
    }
    .unlock-btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
    .hint{
      position:absolute;left:0;right:0;top:80.7%;
      font-family:Arial,sans-serif;
      font-size:clamp(10px,1vw,15px);color:#8fa7ca;
    }
    .msg{
      position:absolute;left:0;right:0;top:94%;
      font-family:Arial,sans-serif;font-size:clamp(8px,.8vw,12px);
      color:#ff8097;letter-spacing:.04em;
    }
    .msg.ok{color:#48f0bd}

    .footerline{
      position:absolute;left:7%;right:7%;bottom:10.8%;
      height:1px;background:rgba(89,146,194,.48);
    }
    .footerlinks{
      position:absolute;left:14%;right:14%;bottom:5.4%;
      display:flex;justify-content:space-between;align-items:center;
      font-size:clamp(8px,.85vw,12px);letter-spacing:.24em;text-transform:uppercase;color:#91a9ca;
    }
    .footitem{display:flex;align-items:center;gap:10px}
    .footicon{font-size:clamp(14px,1.5vw,22px);filter:drop-shadow(0 0 6px rgba(67,162,255,.3))}
    .powered{
      position:absolute;left:0;right:0;bottom:1.2%;text-align:center;
      font-size:clamp(7px,.72vw,10px);letter-spacing:.28em;text-transform:uppercase;color:#516f95;
    }
    .powered b{color:#20e9bd}

    @media (max-width:700px){
      .app{padding:10px;align-items:start}
      .panel{
        width:96vw;
        min-width:0;
        aspect-ratio:auto;
        min-height:890px;
        margin:10px 0;
      }
      .brand,.cards,.lockwrap,.footerline,.footerlinks,.powered{position:relative;left:auto;right:auto;top:auto;bottom:auto;height:auto}
      .brand{padding:30px 16px 0}
      .logo{font-size:58px}
      .nav,.tag{font-size:9px;gap:10px;letter-spacing:.16em}
      .cards{display:grid;grid-template-columns:1fr;gap:14px;margin:28px 18px 0}
      .social{min-height:128px}
      .lockwrap{margin:26px 18px 0;height:330px}
      .lockicon{width:42px}
      .unlock-title{font-size:14px;white-space:normal}
      .inputbox{top:36%}
      .unlock-btn{top:58%}
      .hint{top:80%}
      .footerline{margin:12px 28px 0}
      .footerlinks{margin:20px 32px 0;font-size:8px}
      .powered{margin:18px 0 20px}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script>
  (() => {
    const h = React.createElement;
    const PASSWORD_SHA256 = "6fac255cd8b8a48872bc15838607a084823cf332edf7d5bda6323335eb608774";

    function DonationIcon(){
      return h("svg",{viewBox:"0 0 120 100","aria-hidden":"true"},
        h("defs",null,
          h("linearGradient",{id:"coin",x1:"0",x2:"1"},h("stop",{offset:"0","stop-color":"#ffd257"}),h("stop",{offset:"1","stop-color":"#ff9b00"})),
          h("linearGradient",{id:"hand",x1:"0",x2:"1"},h("stop",{offset:"0","stop-color":"#fff2c5"}),h("stop",{offset:"1","stop-color":"#ffbe39"}))
        ),
        h("circle",{cx:"67",cy:"29",r:"22",fill:"url(#coin)",stroke:"#ffbf17","stroke-width":"4"}),
        h("text",{x:"67",y:"38","text-anchor":"middle",fill:"#6b3c00","font-size":"29","font-weight":"900","font-family":"Arial"},"$"),
        h("path",{d:"M14 65c13 0 17-9 28-9h20c7 0 12 4 12 9 0 5-4 8-10 8H49c-3 0-3 5 0 5h29c8 0 15-2 23-8l10-7c5-3 10 3 6 8-14 16-31 25-52 25H42c-7 0-14-2-21-6L9 83c-5-3-5-13 5-18z",fill:"url(#hand)"})
      );
    }

    function EyeIcon(){
      return h("svg",{viewBox:"0 0 24 24","aria-hidden":"true"},
        h("path",{d:"M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"}),
        h("circle",{cx:"12",cy:"12",r:"2.8"})
      );
    }

    function SocialCard({type,href,title,sub}){
      return h("a",{className:"social "+type,href,target:"_blank",rel:"noopener noreferrer"},
        h("div",{className:"social-icon"},
          type==="donate" ? h(DonationIcon) : h("div",{className:"xmark"},"𝕏")
        ),
        h("div",{className:"social-copy"},
          h("div",{className:"social-title"},title),
          h("div",{className:"social-sub"},sub)
        ),
        h("div",{className:"circle-arrow"},"→")
      );
    }

    function decodeTarget(){
      const q = new URLSearchParams(location.search).get("to");
      if(q){
        try{
          const u = new URL(q, location.href);
          if(u.protocol==="http:" || u.protocol==="https:") return u.href;
        }catch{}
      }
      const raw = location.hash.slice(1);
      if(!raw) return "";
      try{
        const bin = atob(raw);
        const bytes = Uint8Array.from(bin,c=>c.charCodeAt(0));
        const s = new TextDecoder().decode(bytes);
        const u = new URL(s);
        if(u.protocol==="http:" || u.protocol==="https:") return u.href;
      }catch{}
      try{
        const u = new URL(atob(raw));
        if(u.protocol==="http:" || u.protocol==="https:") return u.href;
      }catch{}
      return "";
    }

    async function sha256(text){
      const bytes = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest("SHA-256",bytes);
      return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");
    }

    function App(){
      const [password,setPassword] = React.useState("");
      const [visible,setVisible] = React.useState(false);
      const [message,setMessage] = React.useState("");
      const [ok,setOk] = React.useState(false);
      const [busy,setBusy] = React.useState(false);

      const unlock = async () => {
        if(busy) return;
        if(!password.trim()){setOk(false);setMessage("Enter the password.");return;}
        setBusy(true);
        const valid = await sha256(password.trim()) === PASSWORD_SHA256;
        if(!valid){
          setBusy(false);setOk(false);setMessage("Wrong password.");
          return;
        }
        const target = decodeTarget();
        setOk(true);setMessage("Access unlocked.");
        if(target) setTimeout(()=>location.assign(target),380);
        else setBusy(false);
      };

      return h("main",{className:"app"},
        h("div",{className:"stars"}),
        h("div",{className:"planet-main"}),
        h("div",{className:"planet-small"}),
        h("div",{className:"lightning"}),
        h("div",{className:"ridge left"}),
        h("div",{className:"ridge right"}),
        h("div",{className:"mist"}),
        h("div",{className:"water"}),

        h("section",{className:"panel"},
          h("header",{className:"brand"},
            h("div",{className:"logo"},h("span",{className:"zer"},"ZER"),h("span",{className:"oday"},"0DAY")),
            h("div",{className:"nav"},h("span",null,"GAMES"),h("span",null,"•"),h("span",null,"UPDATES"),h("span",null,"•"),h("span",null,"COMMUNITY")),
            h("div",{className:"tag"},h("span",null,"SUPPORT THE PROJECT"),h("span",null,"•"),h("span",null,"FOLLOW FOR MORE"),h("span",null,"•"),h("span",null,"UNLOCK YOUR ACCESS"))
          ),

          h("div",{className:"cards"},
            h(SocialCard,{type:"donate",href:"https://ko-fi.com/zzer0dayyy",title:"DONATE",sub:"SUPPORT THE PROJECT"}),
            h(SocialCard,{type:"x",href:"https://x.com/_zer0day__",title:"FOLLOW ON X",sub:"STAY UPDATED"})
          ),

          h("div",{className:"lockwrap"},
            h("div",{className:"lockicon"},h("i",{className:"keyhole"})),
            h("div",{className:"unlock-title"},"ENTER PASSWORD TO UNLOCK"),
            h("div",{className:"unlock-sub"},"SUPPORT • FOLLOW • GET ACCESS"),

            h("div",{className:"inputbox"},
              h("div",{className:"mini-lock"}),
              h("input",{
                type:visible?"text":"password",
                value:password,
                placeholder:"Type password...",
                autoComplete:"off",
                onChange:e=>{setPassword(e.target.value);if(message){setMessage("");setOk(false)}},
                onKeyDown:e=>{if(e.key==="Enter") unlock()}
              }),
              h("button",{className:"eye",type:"button","aria-label":"Show or hide password",onClick:()=>setVisible(v=>!v)},h(EyeIcon))
            ),

            h("button",{className:"unlock-btn",type:"button",disabled:busy,onClick:unlock},busy?"OPENING…":"UNLOCK  →"),
            h("div",{className:"hint"},"Hint: ilovezer0day"),
            h("div",{className:"msg"+(ok?" ok":"")},message)
          ),

          h("div",{className:"footerline"}),
          h("div",{className:"footerlinks"},
            h("div",{className:"footitem"},h("span",{className:"footicon"},"🎮"),h("span",null,"GAMES")),
